<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coming Soon</title>
  <meta name="description" content="Something new is on the way.">
  <style>
    :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111; --fg: #f2f2f2; --muted: #9a9a9a; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 1.1rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Something new is coming.</h1>
    <p>This site is under construction. Check back soon.</p>
  </main>
</body>
</html>
